<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Sri Yarn & Tales — Minimalist luxury handmade crochet: artisanal amigurumi toys, architectural bags, bespoke home decor & wearables. Shipped across India." />
    
    <!-- Instant anti-FOUC theme initialization -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('syt-theme');
          var isDark = false;
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed && parsed.state && parsed.state.theme) {
              isDark = parsed.state.theme === 'dark';
            }
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            isDark = true;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#09090b');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Preload critical fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet" />
    
    <!-- Official Brand Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    
    <title>Sri Yarn & Tales — Handmade Crochet, Woven With Love</title>
  </head>
  <body class="bg-white text-zinc-900 dark:bg-[#09090b] dark:text-zinc-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
